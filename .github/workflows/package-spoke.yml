name: Package Spoke

on:
  # Feature PRs run tests only (ci.yml). Packaging is expensive, so it runs
  # here only when a PR touches packaging itself (Linux only), on release PRs
  # to main (all platforms), on tags, and on demand.
  pull_request:
    branches:
      - dev
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    name: Decide what to package
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Choose the packaging matrix
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          linux='{"name":"Linux AppImage and deb","runner":"ubuntu-22.04","bundle":"linux","artifact_name":"spoke-linux-x86_64","console_asset":"spoke-x86_64.AppImage","updater_asset":"spoke-x86_64.AppImage","deb_asset":"spoke-amd64.deb"}'
          macos='{"name":"macOS DMG","runner":"macos-latest","bundle":"dmg","artifact_name":"spoke-macos-aarch64","console_asset":"spoke-aarch64.dmg","updater_asset":"spoke-aarch64.app.tar.gz"}'
          windows='{"name":"Windows NSIS","runner":"windows-latest","bundle":"nsis","artifact_name":"spoke-windows-x86_64","console_asset":"spoke-x86_64-setup.exe","updater_asset":"spoke-x86_64-setup.exe"}'

          # A PR to dev packages only when it touches one of these files.
          packaging_paths=(
            .github/workflows/package-spoke.yml
            scripts/package-spoke.sh
            scripts/normalize-spoke-artifacts.sh
            scripts/assemble-spoke-release.sh
            scripts/install-spoke.sh
            scripts/verify-distribution.mjs
            scripts/write-spoke-update-manifest.mjs
            src-tauri/tauri.conf.json
            src-tauri/Cargo.toml
            spoke-compatibility.json
            package.json
          )

          matrix="[]"
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" || "$GITHUB_BASE_REF" == "main" ]]; then
            matrix="[$linux,$macos,$windows]"
          elif gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate -q '.[].filename' \
              | grep -Eq -e "^src-tauri/capabilities/" -f <(printf '%s\n' "${packaging_paths[@]}" | sed 's/[.]/\\./g; s/^/^/; s/$/$/'); then
            matrix="[$linux]"
          fi

          echo "Packaging matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Verify distribution contract
        run: node scripts/verify-distribution.mjs

      - name: Install Linux desktop packaging dependencies
        if: matrix.bundle == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build native package
        shell: bash
        env:
          SPOKE_BUNDLE_KIND: ${{ matrix.bundle }}
          SPOKE_CREATE_UPDATER_ARTIFACTS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/package-spoke.sh --bundle "${{ matrix.bundle }}"

      - name: Normalize artifact names
        shell: bash
        env:
          SPOKE_REQUIRE_UPDATER_ARTIFACTS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
        run: |
          scripts/normalize-spoke-artifacts.sh \
            --bundle "${{ matrix.bundle }}" \
            --dist-dir "dist/${{ matrix.artifact_name }}" \
            --console-asset "${{ matrix.console_asset }}" \
            --updater-asset "${{ matrix.updater_asset }}" \
            --deb-asset "${{ matrix.deb_asset || '' }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}/*
          if-no-files-found: error

  release:
    name: Publish release assets
    runs-on: ubuntu-22.04
    needs: package
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble release assets
        run: scripts/assemble-spoke-release.sh --tag "$GITHUB_REF_NAME"

      - name: Upload combined release artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoke-release-assets
          path: release/*
          if-no-files-found: error

      - name: Publish release assets for tags
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
