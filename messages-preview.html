<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spoke Messages · Development preview</title>
    <style>
      .preview-toolbar {
        height: 38px;
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        background: #172126;
        color: #fff;
        font: 11px sans-serif;
      }
      .preview-toolbar label {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      #root .spoke-shell {
        height: calc(100dvh - 38px);
      }
      @media (max-width: 600px) {
        .preview-toolbar {
          font-size: 9px;
          padding: 0 8px;
        }
        .preview-toolbar > span {
          max-width: 180px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dev/messages-preview.tsx"></script>
  </body>
</html>
