[package]
name = "spoke"
version = "0.2.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[lib]
name = "spoke_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
# `tauri::generate_context!` expands to code that directly references serde_json.
serde_json = "1"
tauri = { version = "2.9.1", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-jolt = "0.1"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"
